<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="게시판">
<title>내 게시판</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f0f0ee;
  --border: rgba(0,0,0,0.08); --border-md: rgba(0,0,0,0.15);
  --text: #1a1a1a; --text-muted: #666; --text-hint: #aaa;
  --accent: #1a1a1a; --accent-fg: #ffffff;
  --link: #1f6fb2;
  --inbox: #f0c040;
  --danger: #e53e3e;
  --radius: 12px; --radius-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141414; --surface: #1e1e1e; --surface-2: #252525;
    --border: rgba(255,255,255,0.08); --border-md: rgba(255,255,255,0.15);
    --text: #f0f0f0; --text-muted: #999; --text-hint: #555;
    --accent: #f0f0f0; --accent-fg: #141414;
    --link: #6db3e8;
    --inbox: #b8901e;
  }
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-size: 15px; line-height: 1.5;
}
button, input, textarea, select { font-family: inherit; }
a { color: var(--link); }

/* ── 상단바 ───────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--surface); border-bottom: 0.5px solid var(--border);
}
.topbar h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.4px; white-space: nowrap; }
.menu-btn {
  display: none; padding: 6px 10px; border-radius: var(--radius-sm);
  border: 0.5px solid var(--border-md); background: transparent; color: var(--text);
  font-size: 13px; cursor: pointer; flex-shrink: 0;
}
.search-wrap { flex: 1; min-width: 0; position: relative; }
#search-input {
  width: 100%; font-size: 14px; padding: 8px 30px 8px 12px;
  border-radius: 20px; border: 0.5px solid var(--border-md);
  background: var(--bg); color: var(--text); outline: none; -webkit-appearance: none;
}
#search-input:focus { border-color: var(--accent); }
.search-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  border: none; background: none; color: var(--text-hint); cursor: pointer;
  font-size: 15px; line-height: 1; padding: 2px 4px; display: none;
}
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-hint); transition: background .3s; }
.status-dot.online { background: #2e7d52; }
.nav-link { font-size: 12px; color: var(--text-muted); text-decoration: none; white-space: nowrap; padding: 3px 9px; border-radius: 20px; border: 0.5px solid var(--border-md); }
.nav-link:hover { color: var(--text); }

/* ── 레이아웃 ─────────────────────────── */
.layout { display: flex; align-items: flex-start; max-width: 1180px; margin: 0 auto; }
.sidebar {
  width: 260px; flex-shrink: 0; position: sticky; top: 53px;
  height: calc(100vh - 53px); overflow-y: auto;
  padding: 14px 8px 40px 14px; border-right: 0.5px solid var(--border);
}
.main { flex: 1; min-width: 0; padding: 14px 16px 80px; }

/* ── 사이드바 트리 ────────────────────── */
.side-section { font-size: 11px; color: var(--text-hint); margin: 14px 0 6px 6px; letter-spacing: .3px; }
.side-section:first-child { margin-top: 0; }
.node-row {
  display: flex; align-items: center; gap: 2px;
  border-radius: var(--radius-sm); padding: 1px 4px 1px 0; margin-bottom: 1px;
}
.node-row:hover { background: var(--surface-2); }
.node-row.active { background: var(--accent); }
.node-row.active .node-name, .node-row.active .node-count, .node-row.active .twisty, .node-row.active .node-more { color: var(--accent-fg); }
.twisty {
  width: 18px; height: 22px; flex-shrink: 0; border: none; background: none;
  color: var(--text-hint); cursor: pointer; font-size: 9px; line-height: 22px; padding: 0;
  transition: transform .15s;
}
.twisty.leaf { visibility: hidden; }
.twisty.open { transform: rotate(90deg); }
.node-name {
  flex: 1; min-width: 0; text-align: left; border: none; background: none;
  color: var(--text); font-size: 13.5px; cursor: pointer; padding: 4px 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.node-count { font-size: 11px; color: var(--text-hint); flex-shrink: 0; padding: 0 2px; }
.node-more {
  width: 20px; flex-shrink: 0; border: none; background: none; color: var(--text-hint);
  cursor: pointer; font-size: 14px; line-height: 1; padding: 3px 0; opacity: 0; border-radius: 4px;
}
.node-row:hover .node-more, .node-row.active .node-more { opacity: 1; }
.node-more:hover { background: var(--border); }
.side-add {
  width: 100%; text-align: left; margin-top: 8px; padding: 7px 10px;
  border-radius: var(--radius-sm); border: 0.5px dashed var(--border-md);
  background: none; color: var(--text-hint); font-size: 12.5px; cursor: pointer;
}
.side-add:hover { color: var(--text-muted); }

/* ── 메인 헤더 ───────────────────────── */
.crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 3px; font-size: 12px; color: var(--text-hint); margin-bottom: 6px; min-height: 18px; }
.crumbs button { border: none; background: none; color: var(--text-muted); font-size: 12px; cursor: pointer; padding: 1px 2px; }
.crumbs button:hover { color: var(--text); text-decoration: underline; }
.view-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
.view-title { font-size: 21px; font-weight: 600; letter-spacing: -0.5px; word-break: break-all; }
.view-sub { font-size: 12px; color: var(--text-hint); }
.view-actions { display: flex; gap: 5px; flex-wrap: wrap; margin: 10px 0 14px; }
.chip {
  padding: 5px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;
  border: 0.5px solid var(--border-md); background: transparent; color: var(--text-muted);
  white-space: nowrap; transition: all .15s;
}
.chip:hover { color: var(--text); border-color: var(--text-hint); }
.chip.on { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.chip.danger { color: var(--danger); border-color: rgba(229,62,62,.3); }

/* ── 하위 카테고리 카드(드릴다운) ────── */
.subcats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.subcat {
  display: flex; align-items: baseline; gap: 6px;
  padding: 8px 13px; border-radius: var(--radius);
  border: 0.5px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 13.5px; cursor: pointer; transition: all .15s;
}
.subcat:hover { border-color: var(--border-md); }
.subcat span { font-size: 11px; color: var(--text-hint); }

/* ── 글쓰기 ──────────────────────────── */
.compose { border: 0.5px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 18px; }
.compose textarea, .compose input[type=text] {
  width: 100%; border: none; background: transparent; color: var(--text);
  outline: none; font-size: 15px; resize: none; padding: 5px 2px;
}
.compose textarea::placeholder, .compose input::placeholder { color: var(--text-hint); }
#c-title { font-size: 16px; font-weight: 600; }
.compose-extra { display: none; }
.compose-extra.show { display: block; }
.compose-divider { height: 0.5px; background: var(--border); margin: 6px 0; }
.compose-foot { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.compose-foot .spacer { flex: 1; }
.mini-select {
  font-size: 12px; padding: 5px 8px; border-radius: 20px;
  border: 0.5px solid var(--border-md); background: transparent; color: var(--text-muted);
  outline: none; cursor: pointer; max-width: 190px;
}
.save-btn {
  padding: 6px 16px; border-radius: 20px; border: none;
  background: var(--accent); color: var(--accent-fg); font-size: 13px; font-weight: 500; cursor: pointer;
}
.split-label { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-hint); cursor: pointer; }

/* ── 글 목록 ─────────────────────────── */
.posts { display: flex; flex-direction: column; gap: 8px; }
.post {
  border: 0.5px solid var(--border); background: var(--surface);
  border-radius: var(--radius); padding: 12px 14px;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity:0; transform: translateY(-3px);} to { opacity:1; transform:none; } }
.post-head { display: flex; align-items: baseline; gap: 8px; }
.post-title { font-size: 15.5px; font-weight: 600; flex: 1; min-width: 0; word-break: break-word; }
.post-date { font-size: 11.5px; color: var(--text-hint); white-space: nowrap; flex-shrink: 0; }
.post-body { font-size: 14.5px; color: var(--text); margin-top: 5px; word-break: break-word; overflow-wrap: anywhere; }
.post-body.clamped { max-height: 8.4em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.post-body h1 { font-size: 18px; margin: 8px 0 4px; }
.post-body h2 { font-size: 16.5px; margin: 8px 0 4px; }
.post-body h3 { font-size: 15px; margin: 6px 0 3px; }
.post-body ul, .post-body ol { margin: 4px 0 4px 20px; }
.post-body li { margin: 1px 0; }
.post-body pre { background: var(--surface-2); border-radius: 6px; padding: 9px 11px; overflow-x: auto; margin: 6px 0; }
.post-body code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.post-body pre code { background: none; padding: 0; }
.post-body blockquote { border-left: 2.5px solid var(--border-md); padding-left: 10px; color: var(--text-muted); margin: 5px 0; }
.post-body hr { border: none; border-top: 0.5px solid var(--border); margin: 9px 0; }
.post-link {
  display: inline-block; margin-top: 7px; font-size: 12.5px;
  padding: 4px 10px; border-radius: 20px; background: var(--surface-2);
  color: var(--link); text-decoration: none; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.post-foot { display: flex; align-items: center; gap: 5px; margin-top: 9px; flex-wrap: wrap; }
.tag {
  font-size: 11px; padding: 2px 9px; border-radius: 10px;
  border: 0.5px solid var(--border-md); background: none; color: var(--text-muted); cursor: pointer;
}
.tag:hover { color: var(--text); }
.path-badge {
  font-size: 10.5px; padding: 2px 9px; border-radius: 10px;
  background: var(--surface-2); color: var(--text-hint); cursor: pointer; border: none;
}
.path-badge.inbox { color: var(--inbox); }
.post-tools { margin-left: auto; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
.post:hover .post-tools { opacity: 1; }
@media (max-width: 900px) { .post-tools { opacity: .5; } }
.tool-btn { font-size: 11px; border: none; background: none; color: var(--text-hint); cursor: pointer; padding: 3px 6px; border-radius: 6px; }
.tool-btn:hover { background: var(--surface-2); color: var(--text); }
.tool-btn.danger:hover { color: var(--danger); }
.more-btn { font-size: 11.5px; border: none; background: none; color: var(--text-muted); cursor: pointer; padding: 4px 0; margin-top: 2px; }

/* 인라인 편집 */
.edit-form input[type=text], .edit-form textarea {
  width: 100%; font-size: 14.5px; padding: 7px 10px; margin-bottom: 6px;
  border-radius: var(--radius-sm); border: 0.5px solid var(--border-md);
  background: var(--bg); color: var(--text); outline: none; resize: vertical;
}
.edit-form input:focus, .edit-form textarea:focus { border-color: var(--accent); }
.edit-foot { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.empty { text-align: center; padding: 44px 20px; color: var(--text-hint); font-size: 14px; line-height: 1.7; }

/* ── 모달 ────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100;
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.overlay.show { display: flex; }
.modal {
  background: var(--surface); border-radius: 14px; padding: 18px;
  width: 100%; max-width: 380px; box-shadow: 0 12px 40px rgba(0,0,0,.25);
}
.modal h3 { font-size: 15.5px; font-weight: 600; margin-bottom: 4px; }
.modal p { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; word-break: break-word; }
.modal input[type=text], .modal select {
  width: 100%; font-size: 14.5px; padding: 9px 11px; margin-bottom: 12px;
  border-radius: var(--radius-sm); border: 0.5px solid var(--border-md);
  background: var(--bg); color: var(--text); outline: none;
}
.modal-actions { display: flex; justify-content: flex-end; gap: 7px; }
.modal-actions button {
  padding: 7px 15px; border-radius: 20px; font-size: 13px; cursor: pointer;
  border: 0.5px solid var(--border-md); background: transparent; color: var(--text);
}
.modal-actions button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.modal-actions button.danger { background: var(--danger); color: #fff; border-color: transparent; }
.menu-list { display: flex; flex-direction: column; gap: 1px; }
.menu-list button {
  text-align: left; padding: 10px 12px; border-radius: var(--radius-sm);
  border: none; background: none; color: var(--text); font-size: 14px; cursor: pointer;
}
.menu-list button:hover { background: var(--surface-2); }
.menu-list button.danger { color: var(--danger); }

/* ── 반응형 ─────────────────────────── */
@media (max-width: 900px) {
  .menu-btn { display: block; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; height: 100%; width: 268px;
    background: var(--surface); z-index: 90; padding-top: 16px;
    transform: translateX(-100%); transition: transform .22s ease;
    box-shadow: 4px 0 24px rgba(0,0,0,.18);
  }
  .sidebar.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 85; display: none; }
  .scrim.show { display: block; }
  .main { padding: 12px 14px 90px; }
  .view-title { font-size: 19px; }
}
@media (min-width: 901px) { .scrim { display: none !important; } }
</style>
</head>
<body>

<div class="topbar">
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
  <h1>게시판</h1>
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="전체 검색..." autocomplete="off">
    <button class="search-clear" id="search-clear" onclick="clearSearch()">×</button>
  </div>
  <div class="topbar-right">
    <a class="nav-link" href="index.html">체크리스트</a>
    <div class="status-dot" id="status-dot" title="연결 상태"></div>
  </div>
</div>

<div class="scrim" id="scrim" onclick="toggleSidebar(false)"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-section">보관함</div>
    <div id="fixed-views"></div>
    <div class="side-section">카테고리</div>
    <div id="tree"></div>
    <button class="side-add" onclick="openAddNode(null)">＋ 대분류 추가</button>
  </aside>

  <main class="main">
    <div class="crumbs" id="crumbs"></div>
    <div class="view-head">
      <div class="view-title" id="view-title">전체</div>
      <div class="view-sub" id="view-sub"></div>
    </div>
    <div class="view-actions" id="view-actions"></div>
    <div class="subcats" id="subcats"></div>

    <div class="compose">
      <div class="compose-extra" id="compose-extra">
        <input type="text" id="c-title" placeholder="제목 (선택)">
        <div class="compose-divider"></div>
      </div>
      <textarea id="c-body" rows="2" placeholder="여기에 기록하세요. 카테고리를 고르지 않으면 미분류로 들어갑니다."></textarea>
      <div class="compose-extra" id="compose-extra2">
        <div class="compose-divider"></div>
        <input type="text" id="c-url" placeholder="링크 URL (선택)">
        <input type="text" id="c-tags" placeholder="태그 (쉼표로 구분, 선택)">
        <label class="split-label" style="margin-top:6px">
          <input type="checkbox" id="c-split"> 줄 단위로 나눠서 각각 저장
        </label>
      </div>
      <div class="compose-foot">
        <select class="mini-select" id="c-cat"></select>
        <button class="chip" id="c-toggle" onclick="toggleCompose()">＋ 상세</button>
        <span class="spacer"></span>
        <button class="save-btn" onclick="submitPost()">저장</button>
      </div>
    </div>

    <div class="posts" id="posts"></div>
  </main>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
/* ══════════════════════════════════════
   Firebase — 체크리스트와 같은 프로젝트,
   컬렉션만 board_nodes / board_posts 로 분리
   ══════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyDMg-MOtRaCGjxUV_D5HsViC1-QIz0cbfc",
  authDomain: "my-checklist-1d462.firebaseapp.com",
  projectId: "my-checklist-1d462",
  storageBucket: "my-checklist-1d462.firebasestorage.app",
  messagingSenderId: "317489669655",
  appId: "1:317489669655:web:13613cec58ffe3f0b19e52"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const NODES = db.collection('board_nodes');
const POSTS = db.collection('board_posts');

/* ══════════════════════════════════════
   상태
   ══════════════════════════════════════ */
const state = {
  nodes: [],            // {id, name, parentId, order}
  posts: [],            // {id, nodeId, title, body, url, tags[], createdAt, updatedAt}
  nodesLoaded: false,
  postsLoaded: false,
  view: 'all',          // 'all' | 'inbox' | nodeId
  search: '',
  tag: null,
  expanded: new Set(),
  includeDesc: true,
  sort: 'new',
  editingId: null,
  expandedPosts: new Set(),
  composeOpen: false
};

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

// HTML 속성 안의 JS 문자열로 안전하게 넣기 위한 이스케이프
const jesc = v => esc(String(v == null ? '' : v).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));

const byId = id => state.nodes.find(n => n.id === id) || null;
const childrenOf = pid => state.nodes
  .filter(n => (n.parentId || null) === (pid || null))
  .sort((a,b) => (a.order || 0) - (b.order || 0));

function pathOf(id) {
  const out = []; let cur = byId(id); let guard = 0;
  while (cur && guard++ < 60) { out.unshift(cur); cur = cur.parentId ? byId(cur.parentId) : null; }
  return out;
}
function descendants(id) {
  const set = new Set([id]); const stack = [id]; let guard = 0;
  while (stack.length && guard++ < 5000) {
    const cur = stack.pop();
    childrenOf(cur).forEach(c => { if (!set.has(c.id)) { set.add(c.id); stack.push(c.id); } });
  }
  return set;
}
function depthOf(id) { return pathOf(id).length - 1; }

function countIn(nodeId, deep) {
  const ids = deep ? descendants(nodeId) : new Set([nodeId]);
  return state.posts.filter(p => ids.has(p.nodeId)).length;
}

function setStatus(on) {
  document.getElementById('status-dot').className = 'status-dot' + (on ? ' online' : '');
}

/* ══════════════════════════════════════
   마크다운 (경량)
   ══════════════════════════════════════ */
function md(src) {
  if (!src) return '';
  const blocks = [];
  const D = '\uE000';                    // 자리표시자 구분자(사설영역 문자)
  const ph = () => D + (blocks.length - 1) + D;
  let s = esc(src).split(D).join('');
  s = s.replace(/```([\s\S]*?)```/g, (m, c) => {
    blocks.push('<pre><code>' + c.replace(/^\n+|\n+$/g, '') + '</code></pre>');
    return ph();
  });
  s = s.replace(/`([^`\n]+)`/g, (m, c) => {
    blocks.push('<code>' + c + '</code>');
    return ph();
  });
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,
    '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^\w*])\*([^\s*][^*\n]*?[^\s*]|[^\s*])\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

  const isPre = i => (blocks[i] || '').indexOf('<pre') === 0;
  const lines = s.split('\n');
  const out = []; let listType = null;
  const closeList = () => { if (listType) { out.push(listType === 'ul' ? '</ul>' : '</ol>'); listType = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    let m;
    if (/^\s*$/.test(line)) { closeList(); continue; }
    if (/^(-{3,}|\*{3,})$/.test(line.trim())) { closeList(); out.push('<hr>'); continue; }
    if ((m = line.match(new RegExp('^\\s*' + D + '(\\d+)' + D + '\\s*$'))) && isPre(+m[1])) {
      closeList(); out.push(D + m[1] + D); continue;
    }
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) {
      closeList(); const h = m[1].length; out.push('<h' + h + '>' + m[2] + '</h' + h + '>'); continue;
    }
    if ((m = line.match(/^&gt;\s?(.*)$/))) { closeList(); out.push(`<blockquote>${m[1]}</blockquote>`); continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
      if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push(`<li>${m[1]}</li>`); continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push(`<li>${m[1]}</li>`); continue;
    }
    closeList();
    out.push(`<div>${line}</div>`);
  }
  closeList();
  let html = out.join('');
  html = html.replace(new RegExp(D + '(\\d+)' + D, 'g'), (m, i) => blocks[+i] || '');
  return html;
}

function fmtDate(ms) {
  if (!ms) return '';
  const d = new Date(ms), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  if (d.getFullYear() === now.getFullYear())
    return d.toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' }).replace(/\.$/, '');
  return d.toLocaleDateString('ko-KR', { year: '2-digit', month: '2-digit', day: '2-digit' }).replace(/\.$/, '');
}

function closeModal() { document.getElementById('overlay').classList.remove('show'); }
function showModal(html) {
  document.getElementById('modal').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function askText({ title, desc, value, placeholder, okLabel, onOk }) {
  showModal(`
    <h3>${esc(title)}</h3>
    ${desc ? `<p>${esc(desc)}</p>` : ''}
    <input type="text" id="modal-input" placeholder="${esc(placeholder || '')}" value="${esc(value || '')}">
    <div class="modal-actions">
      <button onclick="closeModal()">취소</button>
      <button class="primary" id="modal-ok">${esc(okLabel || '확인')}</button>
    </div>`);
  const inp = document.getElementById('modal-input');
  const go = () => { const v = inp.value.trim(); if (!v) return; closeModal(); onOk(v); };
  document.getElementById('modal-ok').onclick = go;
  inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  inp.focus(); inp.select();
}
function askConfirm({ title, desc, okLabel, danger, onOk }) {
  showModal(`
    <h3>${esc(title)}</h3>
    ${desc ? `<p>${esc(desc)}</p>` : ''}
    <div class="modal-actions">
      <button onclick="closeModal()">취소</button>
      <button class="${danger ? 'danger' : 'primary'}" id="modal-ok">${esc(okLabel || '확인')}</button>
    </div>`);
  document.getElementById('modal-ok').onclick = () => { closeModal(); onOk(); };
}

/* 카테고리 선택지 (계층 들여쓰기) */
function catOptions(selectedId, excludeSet, includeInbox, inboxLabel) {
  let html = '';
  if (includeInbox) {
    html += `<option value="__inbox__"${selectedId === null || selectedId === '__inbox__' ? ' selected' : ''}>${esc(inboxLabel || '미분류')}</option>`;
  }
  const walk = (pid, depth) => {
    childrenOf(pid).forEach(n => {
      if (excludeSet && excludeSet.has(n.id)) return;
      const pad = '  '.repeat(depth) + (depth ? '└ ' : '');
      html += `<option value="${esc(n.id)}"${n.id === selectedId ? ' selected' : ''}>${esc(pad + n.name)}</option>`;
      walk(n.id, depth + 1);
    });
  };
  walk(null, 0);
  return html;
}

/* ══════════════════════════════════════
   카테고리 CRUD
   ══════════════════════════════════════ */
function openAddNode(parentId) {
  const p = parentId ? byId(parentId) : null;
  askText({
    title: p ? `"${p.name}" 아래 추가` : '대분류 추가',
    desc: p ? `${depthOf(parentId) + 2}단계 카테고리로 만들어집니다.` : '',
    placeholder: '카테고리 이름',
    okLabel: '추가',
    onOk: name => {
      const ref = NODES.doc();
      ref.set({ name, parentId: parentId || null, order: Date.now(), createdAt: Date.now() })
        .then(() => {
          if (parentId) state.expanded.add(parentId);
          state.view = ref.id;
          render();
        })
        .catch(err => alertError(err));
    }
  });
}

function renameNode(id) {
  const n = byId(id); if (!n) return;
  askText({
    title: '이름 변경', value: n.name, okLabel: '저장',
    onOk: name => NODES.doc(id).update({ name }).catch(alertError)
  });
}

function moveNode(id) {
  const n = byId(id); if (!n) return;
  const block = descendants(id);
  showModal(`
    <h3>"${esc(n.name)}" 위치 옮기기</h3>
    <p>새 상위 카테고리를 고르세요. 하위 항목은 통째로 함께 이동합니다.</p>
    <select id="modal-sel">
      <option value="__root__"${!n.parentId ? ' selected' : ''}>최상위 (대분류)</option>
      ${catOptions(n.parentId || null, block, false)}
    </select>
    <div class="modal-actions">
      <button onclick="closeModal()">취소</button>
      <button class="primary" id="modal-ok">이동</button>
    </div>`);
  document.getElementById('modal-ok').onclick = () => {
    const v = document.getElementById('modal-sel').value;
    closeModal();
    NODES.doc(id).update({ parentId: v === '__root__' ? null : v })
      .then(() => { if (v !== '__root__') state.expanded.add(v); render(); })
      .catch(alertError);
  };
}

function shiftNode(id, dir) {
  const n = byId(id); if (!n) return;
  const sibs = childrenOf(n.parentId || null);
  const i = sibs.findIndex(s => s.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= sibs.length) return;
  const a = sibs[i], b = sibs[j];
  const batch = db.batch();
  batch.update(NODES.doc(a.id), { order: b.order || 0 });
  batch.update(NODES.doc(b.id), { order: a.order || 0 });
  batch.commit().catch(alertError);
}

function deleteNode(id) {
  const n = byId(id); if (!n) return;
  const kids = childrenOf(id);
  const own = state.posts.filter(p => p.nodeId === id);
  const parent = n.parentId || null;
  const dest = parent ? `상위 "${byId(parent) ? byId(parent).name : ''}"` : '미분류 / 최상위';
  askConfirm({
    title: `"${n.name}" 삭제`,
    desc: `하위 카테고리 ${kids.length}개와 글 ${own.length}개는 삭제되지 않고 ${dest}(으)로 옮겨집니다.`,
    okLabel: '삭제', danger: true,
    onOk: () => {
      const batch = db.batch();
      kids.forEach(k => batch.update(NODES.doc(k.id), { parentId: parent }));
      own.forEach(p => batch.update(POSTS.doc(p.id), { nodeId: parent }));
      batch.delete(NODES.doc(id));
      batch.commit()
        .then(() => { if (state.view === id) state.view = parent || 'all'; render(); })
        .catch(alertError);
    }
  });
}

function nodeMenu(id) {
  const n = byId(id); if (!n) return;
  showModal(`
    <h3>${esc(n.name)}</h3>
    <p>${depthOf(id) + 1}단계 · 글 ${countIn(id, false)}개 (하위 포함 ${countIn(id, true)}개)</p>
    <div class="menu-list">
      <button onclick="closeModal();openAddNode('${esc(id)}')">＋ 하위 카테고리 추가</button>
      <button onclick="closeModal();renameNode('${esc(id)}')">이름 변경</button>
      <button onclick="closeModal();moveNode('${esc(id)}')">위치 옮기기</button>
      <button onclick="closeModal();shiftNode('${esc(id)}',-1)">↑ 위로</button>
      <button onclick="closeModal();shiftNode('${esc(id)}',1)">↓ 아래로</button>
      <button class="danger" onclick="closeModal();deleteNode('${esc(id)}')">삭제</button>
    </div>
    <div class="modal-actions" style="margin-top:12px">
      <button onclick="closeModal()">닫기</button>
    </div>`);
}

/* ══════════════════════════════════════
   글 CRUD
   ══════════════════════════════════════ */
function parseTags(str) {
  if (!str) return [];
  return [...new Set(str.split(/[,\n]/)
    .map(t => t.trim().replace(/^#/, '').replace(/["'<>\\]/g, '').trim())
    .filter(Boolean))].slice(0, 12);
}

function submitPost() {
  const bodyEl = document.getElementById('c-body');
  const titleEl = document.getElementById('c-title');
  const urlEl = document.getElementById('c-url');
  const tagsEl = document.getElementById('c-tags');
  const split = document.getElementById('c-split').checked;
  const catVal = document.getElementById('c-cat').value;
  const nodeId = catVal === '__inbox__' ? null : catVal;

  const body = bodyEl.value.trim();
  const title = titleEl.value.trim();
  const url = urlEl.value.trim();
  const tags = parseTags(tagsEl.value);
  if (!body && !title && !url) return;

  const now = Date.now();
  const batch = db.batch();

  if (split && body) {
    const lines = body.split('\n').map(l => l.trim()).filter(Boolean);
    lines.forEach((line, i) => {
      batch.set(POSTS.doc(), {
        nodeId, title: '', body: line, url: '', tags,
        createdAt: now - i, updatedAt: now
      });
    });
  } else {
    batch.set(POSTS.doc(), { nodeId, title, body, url, tags, createdAt: now, updatedAt: now });
  }

  batch.commit().then(() => {
    bodyEl.value = ''; titleEl.value = ''; urlEl.value = ''; tagsEl.value = '';
    document.getElementById('c-split').checked = false;
    bodyEl.style.height = 'auto';
    setStatus(true);
  }).catch(alertError);
}

function startEdit(id) { state.editingId = id; renderPosts(true); }
function cancelEdit() { state.editingId = null; renderPosts(true); }

function saveEdit(id) {
  const g = k => { const el = document.getElementById(k + '-' + id); return el ? el.value : ''; };
  POSTS.doc(id).update({
    title: g('e-title').trim(),
    body: g('e-body').trim(),
    url: g('e-url').trim(),
    tags: parseTags(g('e-tags')),
    updatedAt: Date.now()
  }).then(() => { state.editingId = null; renderPosts(true); }).catch(alertError);
}

function movePost(id) {
  const p = state.posts.find(x => x.id === id); if (!p) return;
  showModal(`
    <h3>글 옮기기</h3>
    <p>${esc((p.title || p.body || '').slice(0, 60))}</p>
    <select id="modal-sel">${catOptions(p.nodeId, null, true, '미분류 보관함')}</select>
    <div class="modal-actions">
      <button onclick="closeModal()">취소</button>
      <button class="primary" id="modal-ok">이동</button>
    </div>`);
  document.getElementById('modal-ok').onclick = () => {
    const v = document.getElementById('modal-sel').value;
    closeModal();
    POSTS.doc(id).update({ nodeId: v === '__inbox__' ? null : v }).catch(alertError);
  };
}

function deletePost(id) {
  const p = state.posts.find(x => x.id === id); if (!p) return;
  askConfirm({
    title: '글 삭제',
    desc: (p.title || p.body || '').slice(0, 80),
    okLabel: '삭제', danger: true,
    onOk: () => POSTS.doc(id).delete().catch(alertError)
  });
}

function alertError(err) {
  setStatus(false);
  console.error(err);
  showModal(`
    <h3>저장에 실패했습니다</h3>
    <p>${esc(err && err.message ? err.message : String(err))}</p>
    <div class="modal-actions"><button class="primary" onclick="closeModal()">닫기</button></div>`);
}

/* ══════════════════════════════════════
   보기 전환
   ══════════════════════════════════════ */
function go(view) {
  state.view = view; state.tag = null;
  const sel = document.getElementById('c-cat'); if (sel) sel.dataset.touched = '';
  state.search = ''; document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  if (view !== 'all' && view !== 'inbox') pathOf(view).forEach(n => state.expanded.add(n.id));
  toggleSidebar(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}
function goTag(t) { state.tag = t; state.view = 'all'; render(); window.scrollTo({ top: 0 }); }
function toggleExpand(id) {
  if (state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
  renderSidebar();
}
function toggleSidebar(force) {
  const open = force === undefined ? !document.getElementById('sidebar').classList.contains('open') : force;
  document.getElementById('sidebar').classList.toggle('open', open);
  document.getElementById('scrim').classList.toggle('show', open);
}
function toggleCompose() {
  state.composeOpen = !state.composeOpen;
  document.getElementById('compose-extra').classList.toggle('show', state.composeOpen);
  document.getElementById('compose-extra2').classList.toggle('show', state.composeOpen);
  document.getElementById('c-toggle').textContent = state.composeOpen ? '− 간단히' : '＋ 상세';
}
function toggleIncludeDesc() { state.includeDesc = !state.includeDesc; render(); }
function toggleSort() { state.sort = state.sort === 'new' ? 'old' : 'new'; renderPosts(); }
function togglePostExpand(id) {
  if (state.expandedPosts.has(id)) state.expandedPosts.delete(id); else state.expandedPosts.add(id);
  renderPosts(true);
}
function clearSearch() {
  state.search = '';
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  render();
}

/* ══════════════════════════════════════
   렌더링
   ══════════════════════════════════════ */
function renderSidebar() {
  const fixed = document.getElementById('fixed-views');
  const inboxN = state.posts.filter(p => !p.nodeId).length;
  fixed.innerHTML = `
    <div class="node-row ${state.view === 'all' && !state.search && !state.tag ? 'active' : ''}">
      <button class="twisty leaf"></button>
      <button class="node-name" onclick="go('all')">전체 글</button>
      <span class="node-count">${state.posts.length}</span>
    </div>
    <div class="node-row ${state.view === 'inbox' ? 'active' : ''}">
      <button class="twisty leaf"></button>
      <button class="node-name" onclick="go('inbox')" style="color:${inboxN ? 'var(--inbox)' : ''}">미분류 보관함</button>
      <span class="node-count">${inboxN}</span>
    </div>`;

  const tree = document.getElementById('tree');
  let html = '';
  const walk = (pid, depth) => {
    childrenOf(pid).forEach(n => {
      const kids = childrenOf(n.id);
      const open = state.expanded.has(n.id);
      html += `
        <div class="node-row ${state.view === n.id ? 'active' : ''}" style="padding-left:${depth * 13}px">
          <button class="twisty ${kids.length ? '' : 'leaf'} ${open ? 'open' : ''}"
            onclick="toggleExpand('${esc(n.id)}')">▶</button>
          <button class="node-name" onclick="go('${esc(n.id)}')" title="${esc(n.name)}">${esc(n.name)}</button>
          <span class="node-count">${countIn(n.id, true)}</span>
          <button class="node-more" onclick="nodeMenu('${esc(n.id)}')" title="관리">⋯</button>
        </div>`;
      if (open && kids.length) walk(n.id, depth + 1);
    });
  };
  walk(null, 0);
  tree.innerHTML = html || '<div style="font-size:12.5px;color:var(--text-hint);padding:6px">아직 카테고리가 없습니다</div>';
}

function currentPosts() {
  let list = state.posts;
  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter(p => {
      const path = p.nodeId ? pathOf(p.nodeId).map(n => n.name).join(' ') : '미분류';
      return ((p.title || '') + ' ' + (p.body || '') + ' ' + (p.url || '') + ' ' +
              (p.tags || []).join(' ') + ' ' + path).toLowerCase().includes(q);
    });
  } else if (state.tag) {
    list = list.filter(p => (p.tags || []).includes(state.tag));
  } else if (state.view === 'inbox') {
    list = list.filter(p => !p.nodeId);
  } else if (state.view !== 'all') {
    const ids = state.includeDesc ? descendants(state.view) : new Set([state.view]);
    list = list.filter(p => p.nodeId && ids.has(p.nodeId));
  }
  return list.slice().sort((a, b) =>
    state.sort === 'new' ? (b.createdAt || 0) - (a.createdAt || 0) : (a.createdAt || 0) - (b.createdAt || 0));
}

function renderHeader() {
  const crumbs = document.getElementById('crumbs');
  const title = document.getElementById('view-title');
  const sub = document.getElementById('view-sub');
  const actions = document.getElementById('view-actions');
  const subcats = document.getElementById('subcats');

  let crumbHtml = '', titleText = '', subText = '', actionHtml = '', subHtml = '';
  const n = currentPosts().length;

  if (state.search) {
    titleText = '검색 결과';
    subText = `"${state.search}" · ${n}건`;
    actionHtml = `<button class="chip" onclick="clearSearch()">검색 지우기</button>`;
  } else if (state.tag) {
    titleText = '#' + state.tag;
    subText = `${n}건`;
    actionHtml = `<button class="chip" onclick="go('all')">태그 해제</button>`;
  } else if (state.view === 'inbox') {
    titleText = '미분류 보관함';
    subText = `${n}건`;
    actionHtml = `<button class="chip" onclick="openAddNode(null)">＋ 대분류 만들기</button>`;
  } else if (state.view === 'all') {
    titleText = '전체 글';
    subText = `${n}건`;
    actionHtml = `<button class="chip" onclick="openAddNode(null)">＋ 대분류 추가</button>`;
    subHtml = childrenOf(null).map(c =>
      `<button class="subcat" onclick="go('${esc(c.id)}')">${esc(c.name)}<span>${countIn(c.id, true)}</span></button>`
    ).join('');
  } else {
    const node = byId(state.view);
    if (!node) { state.view = 'all'; return renderHeader(); }
    const path = pathOf(state.view);
    crumbHtml = `<button onclick="go('all')">전체</button>` +
      path.slice(0, -1).map(p => ` / <button onclick="go('${esc(p.id)}')">${esc(p.name)}</button>`).join('');
    titleText = node.name;
    const kids = childrenOf(node.id);
    subText = `${depthOf(node.id) + 1}단계 · 글 ${n}건${kids.length ? ` · 하위 ${kids.length}개` : ''}`;
    actionHtml = `
      <button class="chip" onclick="openAddNode('${esc(node.id)}')">＋ 하위 카테고리</button>
      <button class="chip ${state.includeDesc ? 'on' : ''}" onclick="toggleIncludeDesc()">하위 글 포함</button>
      <button class="chip" onclick="renameNode('${esc(node.id)}')">이름 변경</button>
      <button class="chip" onclick="moveNode('${esc(node.id)}')">위치 옮기기</button>
      <button class="chip danger" onclick="deleteNode('${esc(node.id)}')">삭제</button>`;
    subHtml = kids.map(c =>
      `<button class="subcat" onclick="go('${esc(c.id)}')">${esc(c.name)}<span>${countIn(c.id, true)}</span></button>`
    ).join('');
  }

  crumbs.innerHTML = crumbHtml;
  title.textContent = titleText;
  sub.textContent = subText;
  actions.innerHTML = actionHtml +
    `<button class="chip" onclick="toggleSort()">${state.sort === 'new' ? '최신순' : '오래된순'}</button>`;
  subcats.innerHTML = subHtml;
}

function renderCatSelect() {
  const sel = document.getElementById('c-cat');
  const desired = (state.view !== 'all' && state.view !== 'inbox' && byId(state.view)) ? state.view : '__inbox__';
  const keep = sel.dataset.touched === '1' ? sel.value : desired;
  sel.innerHTML = catOptions(null, null, true, '미분류로 저장');
  const opts = [...sel.options].map(o => o.value);
  sel.value = opts.includes(keep) ? keep : '__inbox__';
}

function renderPosts(force) {
  const wrap = document.getElementById('posts');
  if (!force && state.editingId && document.getElementById('e-body-' + state.editingId)) return;

  if (!state.nodesLoaded || !state.postsLoaded) {
    wrap.innerHTML = '<div class="empty">불러오는 중...</div>';
    return;
  }

  const list = currentPosts();
  if (!list.length) {
    let msg = '아직 글이 없습니다.';
    if (state.search) msg = '검색 결과가 없습니다.';
    else if (state.view === 'inbox') msg = '미분류 보관함이 비어 있습니다.<br>분류를 정하기 전의 메모는 여기로 들어옵니다.';
    else if (state.view === 'all' && !state.posts.length) msg = '위 입력창에 무엇이든 적어 보세요.<br>카테고리는 나중에 정해도 됩니다.';
    wrap.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }

  wrap.innerHTML = list.map(p => {
    if (state.editingId === p.id) {
      return `
      <div class="post">
        <form class="edit-form" onsubmit="event.preventDefault();saveEdit('${esc(p.id)}')">
          <input type="text" id="e-title-${esc(p.id)}" placeholder="제목 (선택)" value="${esc(p.title || '')}">
          <textarea id="e-body-${esc(p.id)}" rows="6" placeholder="본문">${esc(p.body || '')}</textarea>
          <input type="text" id="e-url-${esc(p.id)}" placeholder="링크 URL (선택)" value="${esc(p.url || '')}">
          <input type="text" id="e-tags-${esc(p.id)}" placeholder="태그 (쉼표로 구분)" value="${esc((p.tags || []).join(', '))}">
          <div class="edit-foot">
            <button type="submit" class="save-btn">저장</button>
            <button type="button" class="chip" onclick="cancelEdit()">취소</button>
          </div>
        </form>
      </div>`;
    }

    const pathTxt = p.nodeId
      ? (pathOf(p.nodeId).map(x => x.name).join(' › ') || '분류 없음')
      : '미분류';
    const badgeTarget = p.nodeId && byId(p.nodeId) ? p.nodeId : (p.nodeId ? 'all' : 'inbox');
    const long = (p.body || '').length > 420 || (p.body || '').split('\n').length > 10;
    const open = state.expandedPosts.has(p.id);
    const bodyCls = long && !open ? 'post-body clamped' : 'post-body';
    return `
    <div class="post">
      <div class="post-head">
        ${p.title ? `<div class="post-title">${esc(p.title)}</div>` : '<div class="post-title" style="flex:1"></div>'}
        <div class="post-date">${fmtDate(p.createdAt)}</div>
      </div>
      ${p.body ? `<div class="${bodyCls}">${md(p.body)}</div>` : ''}
      ${long ? `<button class="more-btn" onclick="togglePostExpand('${esc(p.id)}')">${open ? '접기' : '더 보기'}</button>` : ''}
      ${p.url ? `<a class="post-link" href="${esc(p.url)}" target="_blank" rel="noopener">🔗 ${esc(p.url)}</a>` : ''}
      <div class="post-foot">
        <button class="path-badge ${p.nodeId ? '' : 'inbox'}"
          onclick="go('${esc(badgeTarget)}')">${esc(pathTxt)}</button>
        ${(p.tags || []).map(t => `<button class="tag" onclick="goTag('${jesc(t)}')">#${esc(t)}</button>`).join('')}
        <div class="post-tools">
          <button class="tool-btn" onclick="startEdit('${esc(p.id)}')">수정</button>
          <button class="tool-btn" onclick="movePost('${esc(p.id)}')">이동</button>
          <button class="tool-btn danger" onclick="deletePost('${esc(p.id)}')">삭제</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function render() {
  renderSidebar();
  renderHeader();
  renderCatSelect();
  renderPosts();
}

/* ══════════════════════════════════════
   구독
   ══════════════════════════════════════ */
NODES.onSnapshot(snap => {
  state.nodes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  state.nodesLoaded = true;
  setStatus(true);
  render();
}, err => { console.error(err); setStatus(false); });

POSTS.orderBy('createdAt', 'desc').limit(3000).onSnapshot(snap => {
  state.posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  state.postsLoaded = true;
  setStatus(true);
  render();
}, err => { console.error(err); setStatus(false); });

/* ══════════════════════════════════════
   입력 이벤트
   ══════════════════════════════════════ */
let searchTimer = null;
document.getElementById('search-input').addEventListener('input', e => {
  const v = e.target.value;
  document.getElementById('search-clear').style.display = v ? 'block' : 'none';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.search = v.trim(); render(); }, 180);
});

document.getElementById('c-cat').addEventListener('change', e => { e.target.dataset.touched = '1'; });

const bodyEl = document.getElementById('c-body');
bodyEl.addEventListener('input', () => {
  bodyEl.style.height = 'auto';
  bodyEl.style.height = Math.min(bodyEl.scrollHeight, 340) + 'px';
});
bodyEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitPost(); }
});
document.getElementById('c-title').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); bodyEl.focus(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('overlay').classList.contains('show')) closeModal();
    else if (state.editingId) cancelEdit();
  }
  if (e.key === '/' && document.activeElement === document.body) {
    e.preventDefault(); document.getElementById('search-input').focus();
  }
});

render();
</script>
</body>
</html>
